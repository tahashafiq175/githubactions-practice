
# Workflow name
name: "Exploring Contexts in GitHub Actions"

# These events can trigger the workflow
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

jobs:
  event-info-job:
    runs-on: ubuntu-latest

    steps:
      # Print the name of the event that triggered this workflow.
      #
      # github is a predefined GitHub Actions context.
      # event_name is a property inside the github context.
      #
      # GitHub automatically provides this information.
      # We do not need to create or assign a value to it.
      - name: Print The Trigger Event
        run: echo "The Trigger Event is: ${{ github.event_name }}"
