name: 01 - Spring Boot Maven Caching Demo

on:
  workflow_dispatch:

jobs:

  build-job:

    runs-on: ubuntu-latest

    steps:

      - name: CheckOutRepository
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Restore Maven Cache
        id: maven-cache
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('CICDDEMO/pom.xml') }}

      - name: Display Cache Status
        run: |
          echo "Cache Hit: ${{ steps.maven-cache.outputs.cache-hit }}"

      - name: Give Maven Wrapper Permission
        run: chmod +x CICDDEMO/mvnw

      - name: Build Spring Boot Application
        run: |
          cd CICDDEMO
          ./mvnw clean package -DskipTests


  test-job:

    runs-on: ubuntu-latest

    needs:
      - build-job

    steps:

      - name: CheckOutRepository
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Restore Maven Cache
        id: maven-cache
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('CICDDEMO/pom.xml') }}

      - name: Display Cache Status
        run: |
          echo "Cache Hit: ${{ steps.maven-cache.outputs.cache-hit }}"

      - name: Give Maven Wrapper Permission
        run: chmod +x CICDDEMO/mvnw

      - name: Build Spring Boot Application
        run: |
          cd CICDDEMO
          ./mvnw clean package -DskipTests