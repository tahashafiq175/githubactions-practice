
# The name shown in the GitHub Actions tab
name: "01 - First Workflow to Demonstrate Environment Creation"

# Run this workflow whenever code is pushed to one of these branches
on:
  push:
    branches:
      - main
      - feature/*
      - develop

# Workflow-level environment variable.
# This variable is available to jobs and steps in this workflow.
env:
  APPLICATION_NAME: cicddemo

jobs:

  # ==========================================================
  # JOB 1: DEVELOPMENT ENVIRONMENT
  # ==========================================================
  develop-dev-job:

    # The name shown for this job in GitHub Actions
    name: Deploy to Development

    # Run this job only when the pushed branch is "develop".
    # github.ref_name contains the short branch name.
    if: ${{ github.ref_name == 'develop' }}

    # GitHub provides a fresh Ubuntu runner for this job
    runs-on: ubuntu-latest

    # Associate this job with the GitHub Environment named "dev".
    #
    # GitHub can use this environment's variables, secrets,
    # protection rules, and deployment history.
    #
    # The "dev" environment must be configured in repository settings
    # if you want to manage environment-specific settings there.
    environment: dev

    steps:
      # Download the repository files onto the runner.
      # This is necessary before accessing the local project and Dockerfile.
      - name: Checkout repository
        uses: actions/checkout@v4

      # Install Java 21 and configure Maven dependency caching.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Confirm that Java tools are available.
      # The working directory points to the Spring Boot project.
      - name: Verify Java and Maven
        working-directory: ./CICDDEMO
        run: |
          java -version
          javac -version

      # Display the branch that triggered the workflow.
      - name: Display Branch Information
        run: |
          echo "Branch: ${{ github.ref_name }}"

      # Read variables configured for the selected GitHub Environment.
      #
      # If APP_URL and DEBUG_MODE are defined as environment variables
      # in Settings > Environments > dev, their values are available here.
      - name: Display Environment Information
        run: |
          echo "Application URL: ${{ vars.APP_URL }}"
          echo "Application Debug Mode: ${{ vars.DEBUG_MODE }}"

      # Build the Spring Boot application.
      # First make the Maven wrapper executable, then package the project.
      # -DskipTests skips running tests during this Maven build.
      - name: Build Spring Boot Application
        working-directory: ./CICDDEMO
        run: |
          chmod +x mvnw
          ./mvnw clean package -DskipTests

      # Create a unique image tag for this workflow run.
      #
      # GITHUB_RUN_NUMBER = the run number within this repository.
      # GITHUB_SHA::7 = the first seven characters of the commit SHA.
      #
      # Writing to GITHUB_ENV makes IMAGE_TAG available to later steps.
      - name: Generate Dynamic Image Tag
        run: |
          echo "IMAGE_TAG=v${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      # Display information about the build.
      # These are predefined GitHub environment variables, except
      # APPLICATION_NAME, which we defined at workflow level.
      - name: Display Build Information
        run: |
          echo "Application: $APPLICATION_NAME"
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Actor: $GITHUB_ACTOR"
          echo "Branch: $GITHUB_REF_NAME"
          echo "Image Tag: $IMAGE_TAG"

      # Log in to GitHub Container Registry (GHCR).
      #
      # github.actor = the user or account that triggered the workflow.
      # GITHUB_TOKEN = a temporary token provided by GitHub Actions.
      # The workflow must have appropriate package permissions.
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build the Docker image using the Dockerfile in CICDDEMO.
      #
      # push: false means build the image but do not upload it yet.
      # The tag identifies the image in the local Docker image store.
      - name: Build Docker Image
        uses: docker/build-push-action@v7
        with:
          context: ./CICDDEMO
          push: false
          tags: ghcr.io/${{ github.repository_owner }}/${{ env.APPLICATION_NAME }}:${{ env.IMAGE_TAG }}

      # Start a container from the image built above.
      # Map port 8080 on the runner to port 8080 in the container.
      - name: Run Container
        run: |
          docker run -d \
            -p 8080:8080 \
            --name cicddemo-container \
            ghcr.io/${{ github.repository_owner }}/${{ env.APPLICATION_NAME }}:${{ env.IMAGE_TAG }}

      # Give the application time to start, then send an HTTP request.
      # --fail makes curl return a failure status for HTTP errors.
      # If the request fails, this step fails and later steps with
      # success() will not run.
      - name: Smoke Test Application
        run: |
          sleep 25
          curl --fail http://localhost:8080/get/taha

      # Upload the image to GHCR only if earlier steps succeeded.
      # This is conditional on the smoke test and other prior steps passing.
      - name: Push Docker Image to GHCR
        if: ${{ success() }}
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/${{ env.APPLICATION_NAME }}:${{ env.IMAGE_TAG }}

      # If a preceding step fails, attempt to collect container logs.
      - name: Collect Container Logs
        if: ${{ failure() }}
        run: |
          docker logs cicddemo-container

      # Always attempt cleanup, whether the job succeeds or fails.
      # "|| true" prevents a cleanup error from failing the step.
      - name: Cleanup Container
        if: ${{ always() }}
        run: |
          docker rm -f cicddemo-container || true


  # ==========================================================
  # JOB 2: PRODUCTION ENVIRONMENT
  # ==========================================================
  develop-prod-job:

    # Give the production job a clear name.
    name: Deploy to Production

    # Use a fresh Ubuntu runner for this job.
    runs-on: ubuntu-latest

    # Associate this job with the GitHub Environment named "prod".
    #
    # GitHub can apply this environment's own variables, secrets,
    # protection rules, and deployment history.
    #
    # If required reviewers are configured, the job may wait for approval
    # before it starts.
    environment: prod

    steps:
      # Download the repository files onto this job's runner.
      - name: Checkout repository
        uses: actions/checkout@v4

      # Install Java 21 and configure Maven dependency caching.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Verify that Java tools are available in the project directory.
      - name: Verify Java and Maven
        working-directory: ./CICDDEMO
        run: |
          java -version
          javac -version

      # Display the branch that triggered this workflow.
      - name: Display Branch Information
        run: |
          echo "Branch: ${{ github.ref_name }}"

      # These variable values come from the "prod" environment
      # when the variables are configured there.
      #
      # They may differ from the values configured in "dev".
      - name: Display Environment Information
        run: |
          echo "Application URL: ${{ vars.APP_URL }}"
          echo "Application Debug Mode: ${{ vars.DEBUG_MODE }}"

      # Build the Spring Boot application for this job.
      - name: Build Spring Boot Application
        working-directory: ./CICDDEMO
        run: |
          chmod +x mvnw
          ./mvnw clean package -DskipTests

      # Generate a tag for this run and commit.
      - name: Generate Dynamic Image Tag
        run: |
          echo "IMAGE_TAG=v${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      # Display build information.
      - name: Display Build Information
        run: |
          echo "Application: $APPLICATION_NAME"
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Actor: $GITHUB_ACTOR"
          echo "Branch: $GITHUB_REF_NAME"
          echo "Image Tag: $IMAGE_TAG"

      # Authenticate with GitHub Container Registry.
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build the image but do not push it yet.
      - name: Build Docker Image
        uses: docker/build-push-action@v7
        with:
          context: ./CICDDEMO
          push: false
          tags: ghcr.io/${{ github.repository_owner }}/${{ env.APPLICATION_NAME }}:${{ env.IMAGE_TAG }}

      # Run a temporary container for the smoke test.
      - name: Run Container
        run: |
          docker run -d \
            -p 8080:8080 \
            --name cicddemo-container \
            ghcr.io/${{ github.repository_owner }}/${{ env.APPLICATION_NAME }}:${{ env.IMAGE_TAG }}

      # Check whether the application responds successfully.
      - name: Smoke Test Application
        run: |
          sleep 25
          curl --fail http://localhost:8080/get/taha

      # Push the image only when preceding steps have succeeded.
      - name: Push Docker Image to GHCR
        if: ${{ success() }}
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/${{ env.APPLICATION_NAME }}:${{ env.IMAGE_TAG }}

      # Collect logs if an earlier step fails.
      - name: Collect Container Logs
        if: ${{ failure() }}
        run: |
          docker logs cicddemo-container

      # Remove the temporary container regardless of success or failure.
      - name: Cleanup Container
        if: ${{ always() }}
        run: |
          docker rm -f cicddemo-container || true
