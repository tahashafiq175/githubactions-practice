
# Name displayed in the GitHub Actions tab
name: "02 - Workflow to Demonstrate Artifacts for Sharing Build Outputs"

# Start this workflow whenever code is pushed to these branches
on:
  push:
    branches:
      - main
      - feature/*
      - develop

# A workflow-level environment variable.
# All jobs can use this variable.
env:
  APPLICATION_NAME: cicddemo

jobs:

  # ============================================================
  # JOB 1: BUILD THE APPLICATION AND UPLOAD ITS JAR AS AN ARTIFACT
  # ============================================================
  build-job:
    name: Build Spring Boot Application

    # GitHub provides a fresh Ubuntu runner for this job.
    runs-on: ubuntu-latest

    steps:
      # Step 1: Download the repository files to the runner.
      # The runner needs the source code to build our application.
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Install Java 21.
      # Maven caching helps reuse downloaded dependencies.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Step 3: Verify that Java tools are available.
      # Run these commands inside the Spring Boot project directory.
      - name: Verify Java and Maven
        working-directory: ./CICDDEMO
        run: |
          java -version
          javac -version

      # Step 4: Build the Spring Boot application.
      # Make the Maven wrapper executable, then create the package.
      # -DskipTests skips running tests during this build.
      - name: Build Spring Boot Application
        working-directory: ./CICDDEMO
        run: |
          chmod +x mvnw
          ./mvnw clean package -DskipTests

      # Step 5: Show the files produced by the build.
      # Maven normally places JAR files inside the target directory.
      - name: Show Build Output
        working-directory: ./CICDDEMO
        run: |
          ls -lh target/

      # Step 6: Upload the generated JAR as a GitHub Actions artifact.
      #
      # name: cicddemo-jar
      #   This is the name used to identify and download the artifact.
      #
      # path: CICDDEMO/target/*.jar
      #   Upload JAR files matching this path.
      #
      # GitHub stores the artifact so later jobs in this workflow run
      # can download and reuse the build output.
      - name: Upload JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cicddemo-jar
          path: CICDDEMO/target/*.jar


  # ============================================================
  # JOB 2: DEVELOPMENT
  # ============================================================
  develop-dev-job:
    name: Deploy to Development

    # This job must wait for build-job to finish successfully.
    # The JAR artifact must be uploaded before we can download it.
    needs: build-job

    # Run this job only for pushes to the develop branch.
    if: ${{ github.ref_name == 'develop' }}

    # This job gets its own fresh Ubuntu runner.
    runs-on: ubuntu-latest

    # Associate this job with the GitHub Environment named "dev".
    # Its configured variables and protection rules can apply here.
    environment: dev

    steps:
      # Step 1: Check out the repository.
      # The Dockerfile and other project files are needed later.
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Download the JAR produced by build-job.
      #
      # name must match the artifact name used during upload.
      # path specifies where the downloaded JAR should be placed.
      #
      # Notice: this job does not need to run Maven again.
      # It reuses the JAR produced by the build job.
      - name: Download JAR Artifact
        uses: actions/download-artifact@v5
        with:
          name: cicddemo-jar
          path: CICDDEMO/target

      # Step 3: Display configuration variables for the dev environment.
      # APP_URL and DEBUG_MODE should be configured in GitHub settings
      # under Settings > Environments > dev.
      - name: Display Environment Information
        run: |
          echo "Environment: Development"
          echo "Application URL: ${{ vars.APP_URL }}"
          echo "Debug Mode: ${{ vars.DEBUG_MODE }}"

      # Step 4: Generate a tag to identify this run's Docker image.
      #
      # GITHUB_RUN_NUMBER = the workflow run number.
      # GITHUB_SHA::7 = the first seven characters of the commit SHA.
      #
      # Writing to GITHUB_ENV makes IMAGE_TAG available to later steps.
      - name: Generate Dynamic Image Tag
        run: |
          echo "IMAGE_TAG=v${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      # Step 5: Display useful information about the build.
      # APPLICATION_NAME is our custom workflow-level variable.
      # The other GITHUB_* values are provided by GitHub Actions.
      - name: Display Build Information
        run: |
          echo "Application: $APPLICATION_NAME"
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Actor: $GITHUB_ACTOR"
          echo "Branch: $GITHUB_REF_NAME"
          echo "Image Tag: $IMAGE_TAG"

      # Step 6: Log in to GitHub Container Registry (GHCR).
      # GITHUB_TOKEN is provided by GitHub Actions.
      # The workflow needs appropriate package permissions.
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Step 7: Build the Docker image.
      #
      # The build context includes the project directory and Dockerfile.
      # push: false means build locally without uploading the image yet.
      #
      # IMPORTANT:
      # The Dockerfile must be designed to use the downloaded JAR.
      # Downloading an artifact alone does not guarantee that the
      # Dockerfile will use it.
      - name: Build Docker Image
        uses: docker/build-push-action@v7
        with:
          context: ./CICDDEMO
          push: false
          tags: ghcr.io/${{ github.repository_owner }}/${{ env.APPLICATION_NAME }}:${{ env.IMAGE_TAG }}

      # Step 8: Start a container from the image built above.
      # Map runner port 8080 to container port 8080.
      - name: Run Container
        run: |
          docker run -d \
            -p 8080:8080 \
            --name cicddemo-container \
            ghcr.io/${{ github.repository_owner }}/${{ env.APPLICATION_NAME }}:${{ env.IMAGE_TAG }}

      # Step 9: Wait for the application to start, then test its endpoint.
      # curl --fail returns a failure status for HTTP errors.
      - name: Smoke Test Application
        run: |
          sleep 25
          curl --fail http://localhost:8080/get/taha

      # Step 10: Push the image to GHCR only if previous steps succeeded.
      - name: Push Docker Image to GHCR
        if: ${{ success() }}
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/${{ env.APPLICATION_NAME }}:${{ env.IMAGE_TAG }}

      # Step 11: If an earlier step fails, try to collect container logs.
      - name: Collect Container Logs
        if: ${{ failure() }}
        run: |
          docker logs cicddemo-container

      # Step 12: Always try to remove the temporary container.
      # "|| true" prevents cleanup failure from failing this step.
      - name: Cleanup Container
        if: ${{ always() }}
        run: |
          docker rm -f cicddemo-container || true


  # ============================================================
  # JOB 3: PRODUCTION
  # ============================================================
  develop-prod-job:
    name: Deploy to Production

    # Wait for the build job to succeed before starting.
    needs: build-job

    # Run this job only for pushes to the main branch.
    if: ${{ github.ref_name == 'main' }}

    # This job runs on a separate, fresh Ubuntu runner.
    runs-on: ubuntu-latest

    # Associate this job with the GitHub Environment named "prod".
    # Production-specific variables and protection rules can apply.
    environment: prod

    steps:
      # Step 1: Check out the repository.
      # The Dockerfile and other project files are needed for the image build.
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Download the SAME named JAR artifact from build-job.
      #
      # The build job uploaded the artifact as "cicddemo-jar".
      # This job downloads that artifact into CICDDEMO/target.
      #
      # It does not compile the application again.
      - name: Download JAR Artifact
        uses: actions/download-artifact@v5
        with:
          name: cicddemo-jar
          path: CICDDEMO/target

      # Step 3: Display variables configured for production.
      # These can be different from the dev environment's variables.
      - name: Display Environment Information
        run: |
          echo "Environment: Production"
          echo "Application URL: ${{ vars.APP_URL }}"
          echo "Debug Mode: ${{ vars.DEBUG_MODE }}"

      # Step 4: Generate a Docker image tag for this workflow run.
      - name: Generate Dynamic Image Tag
        run: |
          echo "IMAGE_TAG=v${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      # Step 5: Display build and repository information.
      - name: Display Build Information
        run: |
          echo "Application: $APPLICATION_NAME"
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Actor: $GITHUB_ACTOR"
          echo "Branch: $GITHUB_REF_NAME"
          echo "Image Tag: $IMAGE_TAG"

      # Step 6: Log in to GHCR.
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Step 7: Build the production job's Docker image.
      # The Dockerfile must use the downloaded JAR for this to reuse it.
      # push: false means the image is not uploaded during this step.
      - name: Build Docker Image
        uses: docker/build-push-action@v7
        with:
          context: ./CICDDEMO
          push: false
          tags: ghcr.io/${{ github.repository_owner }}/${{ env.APPLICATION_NAME }}:${{ env.IMAGE_TAG }}

      # Step 8: Start the container for testing.
      - name: Run Container
        run: |
          docker run -d \
            -p 8080:8080 \
            --name cicddemo-container \
            ghcr.io/${{ github.repository_owner }}/${{ env.APPLICATION_NAME }}:${{ env.IMAGE_TAG }}

      # Step 9: Test the application's HTTP endpoint.
      - name: Smoke Test Application
        run: |
          sleep 25
          curl --fail http://localhost:8080/get/taha

      # Step 10: Push the image if previous steps succeeded.
      - name: Push Docker Image to GHCR
        if: ${{ success() }}
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/${{ env.APPLICATION_NAME }}:${{ env.IMAGE_TAG }}

      # Step 11: If a preceding step fails, attempt to collect logs.
      - name: Collect Container Logs
        if: ${{ failure() }}
        run: |
          docker logs cicddemo-container

      # Step 12: Always try to clean up the temporary container.
      - name: Cleanup Container
        if: ${{ always() }}
        run: |
          docker rm -f cicddemo-container || true
