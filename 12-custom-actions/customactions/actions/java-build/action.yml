name: "Action to build Java project"

description: "This action builds a Java project using Maven."
inputs:
    java-version:
        description: "Specify the Java version to use (e.g., 8, 11, 17)"
        type: string
        required: false
        default: "21"

runs:
    using: "composite"

    steps:
        - name: "Checkout repository"
          uses: actions/checkout@v4
        - name: "Set up Java"
          uses: actions/setup-java@v3 
          with:
            distribution: "temurin"
            java-version: ${{ inputs.java-version }}
        - name: Give Maven Wrapper Permission
          shell: bash
          run: chmod +x CICDDEMO/mvnw
        
        - name: Build Spring Boot Application
          shell: bash
          run: |
            cd CICDDEMO
            ./mvnw clean package -DskipTests

