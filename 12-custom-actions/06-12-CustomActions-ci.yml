# Name of the workflow
name: "Custom Actions CI for Java Build"

# Run this workflow when code is pushed, a pull request is opened/updated,
# or the workflow is started manually
on:
  push:
  pull_request:

  # Allow the user to start the workflow manually and provide inputs
  workflow_dispatch:
    inputs:
      java-version:
        # Ask which Java version to use
        description: "Specify the Java version to use (e.g., 8, 11, 17)"
        required: false
        default: "21"

      environment-name:
        # Ask which environment name to use
        description: "Specify the environment name (e.g., development, production)"
        required: false
        default: "development"

jobs:
  custom-actions-ci-job:
    # Run the job on an Ubuntu machine
    runs-on: ubuntu-latest

    steps:
      # Download the repository files to the runner
      - name: Checkout repository
        uses: actions/checkout@v4

      # Run our custom Java build action
      - name: Run Java Build Action
        uses: ./.github/actions/java-build
        with:
          # Pass the selected Java version to the custom action
          java-version: ${{ inputs.java-version }}

      # Run our custom environment action
      - name: Run Environment Variables Action
        uses: ./.github/actions/environment
        with:
          # Pass the selected environment name to the custom action
          environment-name: ${{ inputs.environment-name }}

# Purpose of this workflow:
# 1. The workflow runs when code is pushed, a pull request event occurs,
#    or the workflow is started manually.
# 2. When started manually, the user can provide a Java version and environment name.
# 3. The checkout step downloads the repository files.
# 4. The Java build action receives the Java version.
# 5. The environment action receives the environment name.
# 6. Each custom action performs the tasks defined in its own action.yml file.
#
# Important:
# The default inputs apply to manual runs. Push and pull_request runs do not
# receive values from the manual input form, so inputs.java-version and
# inputs.environment-name may be empty for those events.
# The custom actions must define matching inputs in their action.yml files.