name: "Second Workflow Example to Demonstrate purpose of many Matrix"
on: push
jobs:
    Multiple-Matrixes:
        strategy:
            matrix:
                os:
                    - ubuntu-latest
                    - windows-latest
                java:
                    - 21
                    - 25
                    - 26
        runs-on: ${{ matrix.os}}    
        steps:
            - name: "Java Compatibility"
              uses: actions/checkout@v4
           
            - name: setup-java
              uses: actions/setup-java@v4
              with:
                  distribution: 'temurin'
                  java-version: ${{matrix.java}}
            - name: Give Maven Wrapper Permission
              run: chmod +x CICDDEMO/mvnw
            - name: Build Spring Boot Application
              run: |
                  cd CICDDEMO
                  ./mvnw clean package -DskipTests          
