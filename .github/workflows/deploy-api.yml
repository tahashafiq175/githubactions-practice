
name: "2 - Deploy API"

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Choose deployment environment"
        type: choice
        options:
          - development
          - staging
          - production
        required: true
        default: development

jobs:
  deploy:
    runs-on: ubuntu-latest

    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false

    steps:
      - name: Show selected environment
        run: |
          echo "Environment: ${{ inputs.environment }}"
          echo "Concurrency group: deploy-${{ inputs.environment }}"
          echo "API deployment started"
          sleep 60
          echo "API deployment finished"
w