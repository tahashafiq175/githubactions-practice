name: "Third Custom Action Workflow with multiple inputs"
on:
    workflow_dispatch:
        inputs:
            java-version:
                description: "Please enter java version"
                type: string
                required: false
            maven-version:
                description: "Please enter maven version"
                type: string
                required: false    
jobs:
    custom-action-job:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
            - name: Run Custom Action
              uses: ./.github/actions/hello-world      
            #   with:
            #     java-version: "21"
            #     mvn-version: "3.9.4"

