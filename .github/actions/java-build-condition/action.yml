name: "Action to build Java project based on a condition"
description: "This action builds a Java project using Maven based on a specified condition."
inputs:
    java-version:
        description: "Specify the Java version to use (e.g., 8, 11, 17)"
        required: false
        default: "21"
    test-condition:
        description: "Condition to determine whether to build the project (true/false)"
        required: true

runs: 
    using: "composite"
    steps:
        - name: "Checkout repository"
          uses: actions/checkout@v4

        - name: "Set up Java"
          uses: actions/setup-java@v3 
          with:
            distribution: "temurin"
            java-version: ${{ inputs.java-version }}

        - name: Give Maven Wrapper Permission
          shell: bash
          run: chmod +x CICDDEMO/mvnw

        - name: Build Spring Boot Application (Conditional)
          shell: bash
          run: |
            cd CICDDEMO
            if [ "${{ inputs.test-condition }}" = "true" ]; then
              echo "Condition met. Building the project..."
              ./mvnw clean package
            elif [ "${{ inputs.test-condition }}" = "false" ]; then
              echo "Condition is false. Skipping the build."
              ./mvnw clean package -DskipTests
            else
              echo "Condition not met. Skipping the build."
            fi
            
