
# A separate workflow from the Maven caching demo.
name: "01 -07 SpringBoot - Artifacts CI Workflow"

# Start this workflow when code is pushed to the repository.
on: push

jobs:
  springboot-ci-job:
    # GitHub creates a runner for building and testing the application.
    runs-on: ubuntu-latest

    steps:
      # Step 1: Download the repository files.
      - name: CheckOutRepository
        uses: actions/checkout@v7

      # Step 2: Set up Java 21.
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # Step 3: Make the Maven Wrapper executable.
      - name: Give Maven Wrapper Permission
        run: chmod +x CICDDEMO/mvnw

      # Step 4: Build the Spring Boot application.
      - name: Build Spring Boot Application
        run: |
          cd CICDDEMO

          # Compile the project and package the application.
          # Tests are skipped in this command.
          ./mvnw clean package -DskipTests

      # Step 5: Build a Docker image using the project's Dockerfile.
      - name: Build Docker Image
        run: docker build -t githubaction-springboot-app:v1 ./CICDDEMO

      # Step 6: Start a container from the image.
      # Host port 8082 forwards traffic to container port 8080.
      - name: Run Container
        run: |
          docker run -d \
            -p 8082:8080 \
            --name githubaction-springboot-container \
            githubaction-springboot-app:v1

      # Step 7: Show container status.
      - name: Check Container Status
        run: docker ps -a

      # Step 8: Check the application endpoint and capture its response.
      - name: Smoke Test
        run: |
          # Give Spring Boot some time to start.
          sleep 10

          echo "===== CONTAINER LOGS ====="
          docker logs githubaction-springboot-container

          echo "===== CURL TEST ====="

          # Save the request output in a report file.
          # --fail makes HTTP error responses such as 404 or 500
          # cause curl to return a failure exit code.
          #
          # The report captures both standard output and standard error.
          curl --fail -v http://localhost:8082/get/taha \
            > smoke-test-report.txt 2>&1

      # Step 9: Capture the real Docker container logs in a file.
      - name: Docker Logs
        if: always()
        run: |
          # The container may not have been created if an earlier step failed.
          # If it exists, capture its logs.
          if docker container inspect githubaction-springboot-container \
              > /dev/null 2>&1; then
            docker logs githubaction-springboot-container \
              > Container-logs.txt 2>&1
          else
            echo "Container was not created." > Container-logs.txt
          fi

      # Step 10: Upload the generated report files as an artifact.
      - name: Upload Artifacts
        if: always()

        uses: actions/upload-artifact@v7
        with:
          # This is the artifact's name, not a filename.
          name: springboot-app-artifacts

          # Upload these files from the workspace.
          # The paths are relative to the workspace root.
          path: |
            smoke-test-report.txt
            Container-logs.txt

          # Do not fail the workflow solely because a report file
          # was not generated when an earlier step failed.
          if-no-files-found: warn

  # JOB 2: Inspect the reports generated by the first job.
  review-job:
    runs-on: ubuntu-latest

    # Normally, this job waits for springboot-ci-job to succeed.
    needs: springboot-ci-job

    # Allow this review job to run even if the preceding job failed,
    # so that it can inspect reports uploaded by the preceding job.
    if: always()

    steps:
      # This job runs on a different, fresh runner.
      # It does not automatically contain the files from job 1.
      #
      # Download the artifact saved by the first job.
      - name: Download Artifacts
        uses: actions/download-artifact@v8
        with:
          name: springboot-app-artifacts

          # Download the files into the current workspace directory.
          path: ./springboot-app-artifacts

      # Read the downloaded files.
      - name: Consume Artifacts
        run: |
          echo "===== SMOKE TEST REPORT ====="

          if [ -f springboot-app-artifacts/smoke-test-report.txt ]; then
            cat springboot-app-artifacts/smoke-test-report.txt
          else
            echo "Smoke test report was not generated."
          fi

          echo "===== CONTAINER LOGS ====="

          if [ -f springboot-app-artifacts/Container-logs.txt ]; then
            cat springboot-app-artifacts/Container-logs.txt
          else
            echo "Container logs were not generated."
          fi
